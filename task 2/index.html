<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Icon sidebar -->
    <nav class="sidebar">
        <img class="logo" src="images/logo.png" alt="Logo">

        <ul class="sidebar-nav">
            <li><a href="#" aria-label="Home"><img class="nav-icon" src="images/Home%20icon.png" alt=""></a></li>
            <li><a href="#" aria-label="Alerts"><img class="nav-icon" src="images/Alarm%20Icon.png" alt=""></a></li>
            <li><a href="#" aria-label="Calendar"><img class="nav-icon" src="images/Calendar%20icon.png" alt=""></a></li>
            <li><a href="#" aria-label="Analytics"><img class="nav-icon" src="images/Line%20Chart%20Icon.png" alt=""></a></li>
            <li><a href="#" aria-label="Profile"><img class="nav-icon" src="images/User%20icon.png" alt=""></a></li>
        </ul>

        <a class="settings-link" href="#" aria-label="Settings">
            <i class="fa-solid fa-gear" aria-hidden="true"></i>
        </a>
    </nav>

    <!-- Settings menu -->
    <aside class="settings-menu">
        <header class="menu-header">
            <a href="#" aria-label="Back"><i class="fa-solid fa-angle-left" aria-hidden="true"></i></a>
            <h1>Settings</h1>
        </header>

        <ul class="menu">
            <li>
                <a class="menu-link" href="#" aria-current="page">
                    <img class="menu-icon" src="images/edit%20icon.png" alt="">
                    <span>Edit profile</span>
                </a>
            </li>
            <li>
                <a class="menu-link" href="#">
                    <img class="menu-icon" src="images/notifications%20icon.png" alt="">
                    <span>Notification</span>
                </a>
            </li>
            <li>
                <a class="menu-link" href="#">
                    <img class="menu-icon" src="images/security%20icon.png" alt="">
                    <span>Security</span>
                </a>
            </li>
            <li>
                <a class="menu-link" href="#">
                    <img class="menu-icon" src="images/setting%20icon.png" alt="">
                    <span>Appearance</span>
                </a>
            </li>
            <li>
                <a class="menu-link" href="#">
                    <img class="menu-icon" src="images/help%20icon.png" alt="">
                    <span>Help</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main content -->
    <main class="main">
        <div class="topbar">
            <img class="bell" src="images/Notifications.png" alt="Notifications">
            <img class="avatar" src="images/unsplash_C8Ta0gwPbQg.png" alt="Profile picture">
        </div>

        <div class="page-content">
            <header class="page-header">
                <h2>Edit profile</h2>
                <img class="avatar avatar--large" src="images/unsplash_C8Ta0gwPbQg.png" alt="Profile picture">
            </header>

            <form class="form" action="#" method="post">

                <div class="field">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" placeholder="Mehrab" autocomplete="given-name" required>
                </div>

                <div class="field">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" placeholder="Bozorgi" autocomplete="family-name" required>
                </div>

                <div class="field field--full">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <input type="email" id="email" name="email" placeholder="Mehrabbozorgi.business@gmail.com" autocomplete="email" required>
                        <i class="fa-solid fa-square-check input-icon input-icon--valid" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="field field--full">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="33062 Zboncak isle" autocomplete="street-address">
                </div>

                <div class="field field--full">
                    <label for="phone">Contact Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="58077.79" autocomplete="tel" required>
                </div>

                <div class="field">
                    <label for="city">City</label>
                    <div class="input-wrap">
                        <select id="city" name="city" required>
                            <option value="" disabled selected>Select your city</option>
                            <option value="new_york">New York</option>
                            <option value="los_angeles">Los Angeles</option>
                            <option value="london">London</option>
                            <option value="paris">Paris</option>
                            <option value="tokyo">Tokyo</option>
                        </select>
                        <i class="fa-solid fa-angle-down input-icon input-icon--arrow" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="field">
                    <label for="state">State</label>
                    <div class="input-wrap">
                        <select id="state" name="state" required>
                            <option value="" disabled selected>Select your state</option>
                            <option value="california">California</option>
                            <option value="texas">Texas</option>
                            <option value="new_york">New York</option>
                            <option value="dubai">Dubai</option>
                            <option value="berlin">Berlin</option>
                        </select>
                        <i class="fa-solid fa-angle-down input-icon input-icon--arrow" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="field field--full">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" maxlength="20" autocomplete="new-password" required>
                        <i class="fa-solid fa-square-check input-icon input-icon--valid" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn--cancel" type="reset">Cancel</button>
                    <button class="btn btn--save" type="submit">Save</button>
                </div>

            </form>
        </div>
    </main>

</body>
</html>
