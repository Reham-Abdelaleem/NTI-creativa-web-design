<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
    <title>Card/Image hover animation</title>
</head>
<body>
    <section class="container">
        <div class="cards d-flex">

            <!-- Dewey Bruen's card -->
            <article class="card rel" tabindex="0">
                <div class="back abs">
                    <div class="info d-flex">
                        <h2>Dewey Bruen</h2>
                        <p>Founder</p>
                        <ul class="d-flex">
                            <li><a href="#" aria-label="Dewey Bruen on Facebook"><i class="fa-brands fa-facebook" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Dewey Bruen on Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Dewey Bruen on LinkedIn"><i class="fa-brands fa-square-linkedin" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Dewey Bruen on X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a></li>
                        </ul>
                    </div>
                </div>
                <div class="front abs">
                    <img src="images/dewey.jpg" alt="Dewey Bruen">
                </div>
            </article>

            <!-- Shannon O'Conner's card -->
            <article class="card rel" tabindex="0">
                <div class="back abs">
                    <div class="info d-flex">
                        <h2>Shannon O'Conner</h2>
                        <p>Co Founder</p>
                        <ul class="d-flex">
                            <li><a href="#" aria-label="Shannon O'Conner on Facebook"><i class="fa-brands fa-facebook" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Shannon O'Conner on Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Shannon O'Conner on LinkedIn"><i class="fa-brands fa-square-linkedin" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Shannon O'Conner on X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a></li>
                        </ul>
                    </div>
                </div>
                <div class="front abs">
                    <img src="images/shannon.jpg" alt="Shannon O'Conner">
                </div>
            </article>

            <!-- Amber Zulauf's card -->
            <article class="card rel" tabindex="0">
                <div class="back abs">
                    <div class="info d-flex">
                        <h2>Amber Zulauf</h2>
                        <p>UX Designer</p>
                        <ul class="d-flex">
                            <li><a href="#" aria-label="Amber Zulauf on Facebook"><i class="fa-brands fa-facebook" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Amber Zulauf on Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Amber Zulauf on LinkedIn"><i class="fa-brands fa-square-linkedin" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Amber Zulauf on X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a></li>
                        </ul>
                    </div>
                </div>
                <div class="front abs">
                    <img src="images/amber.jpg" alt="Amber Zulauf">
                </div>
            </article>

            <!-- Kenny Cassin's card -->
            <article class="card rel" tabindex="0">
                <div class="back abs">
                    <div class="info d-flex">
                        <h2>Kenny Cassin</h2>
                        <p>UI Designer</p>
                        <ul class="d-flex">
                            <li><a href="#" aria-label="Kenny Cassin on Facebook"><i class="fa-brands fa-facebook" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Kenny Cassin on Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Kenny Cassin on LinkedIn"><i class="fa-brands fa-square-linkedin" aria-hidden="true"></i></a></li>
                            <li><a href="#" aria-label="Kenny Cassin on X"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a></li>
                        </ul>
                    </div>
                </div>
                <div class="front abs">
                    <img src="images/kenny.jpg" alt="Kenny Cassin">
                </div>
            </article>

        </div>
    </section>

    <script>
        // On touch devices there is no hover, so tapping a card toggles it open
        const cards = document.querySelectorAll('.card');
        const isTouch = window.matchMedia('(hover: none)').matches;

        if (isTouch) {
            cards.forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('a')) return;
                    const wasOpen = card.classList.contains('is-open');
                    cards.forEach(c => c.classList.remove('is-open'));
                    if (!wasOpen) card.classList.add('is-open');
                });
            });
        }
    </script>
</body>
</html>
