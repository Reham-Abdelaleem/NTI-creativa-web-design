<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Card/Image hover animation</title>
</head>
<body>
    <section class="container">
        <div class="cards d-flex">
            <!-- Dewey Bruen's card -->
            <div class="card rel">
                <div class="back abs">
                    <div class="info d-flex">
                        <h2>Dewey Bruen</h2>
                        <p>Founder</p>
                        <ul class="d-flex">
                            <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-square-linkedin"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
                        </ul>
                    </div>
                </div>    
                <div class="front abs">
                    <img src="images/dewey.jpg" alt="">
                </div>                
            </div>
            <!-- Shannon O'Conner's card -->
            <div class="card rel">
                <div class="back abs">
                    <div class="info d-flex">
                        <h2>Shannon O'Conner</h2>
                        <p>Co Founder</p>
                        <ul class="d-flex">
                            <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-square-linkedin"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
                        </ul>
                    </div>                        
                </div>
                 <div class="front abs">
                    <img src="images/shannon.jpg" alt="">
                </div>                
            </div>
            <!-- Amber Zulauf's card -->
            <div class="card rel">
                <div class="back abs">
                    <div class="info d-flex">
                        <h2>Amber Zulauf</h2>
                        <p>UX Designer</p>
                        <ul class="d-flex">
                            <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-square-linkedin"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
                        </ul>                        
                    </div>
                </div>                
                 <div class="front abs">
                    <img src="images/amber.jpg" alt="">
                </div>
            </div>
            <!-- Kenny Cassin's card -->
            <div class="card rel">
                <div class="back abs">
                    <div class="info d-flex">
                        <h2>Kenny Cassin</h2>
                        <p>UI Designer</p>
                        <ul class="d-flex">
                            <li><a href="#"><i class="fa-brands fa-facebook"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-instagram"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-square-linkedin"></i></a></li>
                            <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
                        </ul>
                    </div>
                </div>
                <div class="front abs">
                    <img src="images/kenny.jpg" alt="">
                </div>
            </div>
        </div>
    </section>
</body>
</html>
